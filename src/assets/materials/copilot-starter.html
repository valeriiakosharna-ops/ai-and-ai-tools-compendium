<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Практика з GitHub Copilot</title>
  <style>
    body { max-width: 620px; margin: 60px auto; padding: 24px; font: 17px/1.7 system-ui; color: #302a40; }
    h1 { line-height: 1.2; }
    button { padding: 12px 20px; border: 0; border-radius: 8px; background: #00a6eb; color: #302a40; font: inherit; cursor: pointer; }
    button:disabled { opacity: .5; cursor: default; }
  </style>
</head>
<body>
  <h1>Майстерня ШІ</h1>
  <p>Навчальний приклад на 20 місць. Це не справжня реєстрація.</p>
  <p id="availability" role="status" aria-live="polite">Вільних місць: 20</p>
  <button id="reserve" type="button">Зайняти одне місце</button>
</body>
</html>
