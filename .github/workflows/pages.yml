name: Check and deploy field guide
on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Detect deployment prefix
        id: prefix
        env:
          REPOSITORY_NAME: ${{ github.event.repository.name }}
        shell: bash
        run: |
          if [[ "$REPOSITORY_NAME" == *.github.io ]]; then
            echo 'path=/' >> "$GITHUB_OUTPUT"
          else
            echo "path=/$REPOSITORY_NAME/" >> "$GITHUB_OUTPUT"
          fi
      - run: npm run check
        env:
          SITE_PATH_PREFIX: ${{ steps.prefix.outputs.path }}
      - name: Install test browser
        run: npx playwright-core install --with-deps chromium
      - run: npm run test:browser
        env:
          SITE_PATH_PREFIX: ${{ steps.prefix.outputs.path }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-screenshots
          path: .cache/screenshots/
          if-no-files-found: ignore
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          path: _site
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/deploy-pages@v4
        id: deployment
